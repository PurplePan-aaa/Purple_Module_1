        var map = L.map('map', {

        }).fitBounds([[22.257419365234906,113.90271841860537],[22.29695181439231,113.97713244054871]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_omp100_2025_clipped1_0');

        function pop_module1_3(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td class="visible-with-data" id="Photo ID" colspan="2"><strong>Photo ID</strong><br />' + (feature.properties['Photo ID'] !== null ? autolinker.link(String(feature.properties['Photo ID']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\

                    </tr>\

                    </tr>\

                    </tr>\

                    </tr>\
                    <tr>\
                        <td class="visible-with-data" id="Location Precision" colspan="2"><strong>Location Precision</strong><br />' + (feature.properties['Location Precision'] !== null ? autolinker.link(String(feature.properties['Location Precision']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td class="visible-with-data" id="Location Source" colspan="2"><strong>Location Source</strong><br />' + (feature.properties['Location Source'] !== null ? autolinker.link(String(feature.properties['Location Source']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\

                    </tr>\
                    <tr>\
                        <td class="visible-with-data" id="Latitude" colspan="2"><strong>Latitude</strong><br />' + (feature.properties['Latitude'] !== null ? autolinker.link(String(feature.properties['Latitude']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td class="visible-with-data" id="Longtitude" colspan="2"><strong>Longtitude</strong><br />' + (feature.properties['Longtitude'] !== null ? autolinker.link(String(feature.properties['Longtitude']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_module1_3_0() {
            return {
                pane: 'pane_module1_3',
                radius: 8.0,
                opacity: 1,

        map.getPane('pane_module1_3').style.zIndex = 403;
        map.getPane('pane_module1_3').style['mix-blend-mode'] = 'normal';
        var layer_module1_3 = new L.geoJson(json_module1_3, {
            attribution: '',

            layerName: 'layer_module1_3',

            onEachFeature: pop_module1_3,
            pointToLayer: function (feature, latlng) {
                var context = {

                };
                return L.circleMarker(latlng, style_module1_3_0(feature));
            },
        });
        var cluster_module1_3 = new L.MarkerClusterGroup({showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 2});
        cluster_module1_3.addLayer(layer_module1_3);

        bounds_group.addLayer(layer_module1_3);
        cluster_module1_3.addTo(map);
        setBounds();
        L.ImageOverlay.include({

        resetLabels([layer_module1_3]);
        map.on("zoomend", function(){

<script>
(function () {
  function setupBox09() {
    if (
      typeof L === "undefined" ||
      typeof map === "undefined" ||
      !(map instanceof L.Map)
    ) {
      console.warn("Box09：找不到 Leaflet map，未套用新版面。");
      return;
    }

    document.body.classList.add("box09-page");
    document.title = "Box09照片整理——馬灣涌漁村舊探";

    var mapElement = map.getContainer();
    var panel = document.getElementById("box09-panel");
    var details = document.getElementById("box09-details");

    /* 手機上讓地圖排在資訊卡前面 */
    mapElement.insertAdjacentElement("afterend", panel);

    var fieldLabels = {
      "Photo ID": "照片編號",
      "Date": "拍攝日期",
      "Place": "地點",
      "Subject": "主題",
      "Photographer": "攝影者",
      "Photo Source": "照片來源",
      "Description": "照片描述",
      "Location Precision": "定位細緻度",
      "Location Source": "定位依據",
      "Uncertainty": "定位不確定性",
      "Latitude": "緯度",
      "Longitude": "經度"
    };

    var hiddenFields = [
      "photo path",
      "photo_path",
      "latitude",
      "longitude"
    ];

    function copyPopupToPanel(popup) {
      var popupElement = popup.getElement();
      if (!popupElement) return;

      var original = popupElement.querySelector(
        ".leaflet-popup-content"
      );
      if (!original) return;

      var copy = original.cloneNode(true);

      /* 移除複製內容的 id，避免同頁重複 */
      copy.removeAttribute("id");
      copy.querySelectorAll("[id]").forEach(function (node) {
        node.removeAttribute("id");
      });

      /* 把現有已修好的圖片移到資訊卡頂部 */
      var images = Array.from(copy.querySelectorAll("img"));
      var imageArea = document.createElement("div");

      images.forEach(function (image) {
        image.removeAttribute("width");
        image.removeAttribute("height");
        image.loading = "lazy";
        image.alt = image.alt || "馬灣涌歷史照片";
        imageArea.appendChild(image);
      });

      copy.querySelectorAll("tr").forEach(function (row) {
        var heading = row.querySelector("th");
        if (!heading) return;

        var name = heading.textContent.trim();
        var normalized = name.replace(/:$/, "").trim();

        if (
          hiddenFields.indexOf(normalized.toLowerCase()) !== -1
        ) {
          row.remove();
          return;
        }

        if (fieldLabels[normalized]) {
          heading.textContent = fieldLabels[normalized];
        }
      });

      details.replaceChildren();

      if (images.length) {
        details.appendChild(imageArea);
      }

      while (copy.firstChild) {
        details.appendChild(copy.firstChild);
      }

      panel.scrollTop = 0;
    }

    /* 等其他原有彈窗處理完成後，再複製內容 */
    map.on("popupopen", function (event) {
      window.requestAnimationFrame(function () {
        copyPopupToPanel(event.popup);
      });
    });

    /* 統一照片點外觀，不改動座標或圖片資料 */
    var visited = new WeakSet();

    function stylePhotoLayer(layer) {
      if (!layer || visited.has(layer)) return;
      visited.add(layer);

      var geometry = layer.feature && layer.feature.geometry;
      var isPoint = geometry &&
        (geometry.type === "Point" ||
         geometry.type === "MultiPoint");

      if (isPoint && layer instanceof L.CircleMarker) {
        layer.setStyle({
          color: "#ffffff",
          weight: 3,
          fillColor: "#9bd2ef",
          fillOpacity: 0.95
        });
        layer.setRadius(8);
      } else if (isPoint && layer instanceof L.Marker) {
        layer.setIcon(L.divIcon({
          className: "box09-marker",
          iconSize: [18, 18],
          iconAnchor: [9, 9],
          popupAnchor: [0, -10]
        }));
      }

      if (typeof layer.eachLayer === "function") {
        layer.eachLayer(stylePhotoLayer);
      }
    }

    map.eachLayer(stylePhotoLayer);

    map.on("layeradd", function (event) {
      stylePhotoLayer(event.layer);
    });

    window.requestAnimationFrame(function () {
      map.invalidateSize({ pan: false });
    });

    window.addEventListener("resize", function () {
      map.invalidateSize({ pan: false });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupBox09);
  } else {
    setupBox09();
  }
})();
</script>
    </body>
</html>
